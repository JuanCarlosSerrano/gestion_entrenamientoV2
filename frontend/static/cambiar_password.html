<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña | MindPace V2</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel auth-panel--form">
      <p class="auth-kicker">MindPace V2</p>
      <h1>Cambiar contraseña</h1>
      <p class="auth-copy">Actualiza la contraseña temporal para acceder a tu panel.</p>

      <form id="passwordChangeForm" class="form-grid">
        <label for="current_password">Contraseña temporal</label>
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>

        <label for="new_password">Nueva contraseña</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required>

        <label for="confirm_password">Confirmar contraseña</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>

        <button type="submit">Guardar contraseña</button>
      </form>
    </section>
  </main>

  <script src="js/utils/csrf.js"></script>
  <script>
    const API_BASE = window.API_BASE || window.location.origin;
    const redirects = {
      admin: 'admin/index.html',
      entrenador: 'entrenador/index.html',
      atleta: 'atleta/index.html',
    };

    document.getElementById('passwordChangeForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const currentPassword = document.getElementById('current_password').value;
      const newPassword = document.getElementById('new_password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      if (newPassword !== confirmPassword) {
        alert('La confirmación de contraseña no coincide.');
        return;
      }
      const csrf = await window.CSRF.ensureToken(true).catch(() => null);
      if (!csrf) {
        alert('No se pudo obtener token CSRF. Recarga la página.');
        return;
      }
      const response = await fetch(`${API_BASE}/usuarios/password`, {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrf,
        },
        body: JSON.stringify({
          current_password: currentPassword,
          new_password: newPassword,
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        alert(data.error || 'No se pudo cambiar la contraseña.');
        return;
      }
      alert('Contraseña actualizada correctamente.');
      window.location.href = redirects[localStorage.getItem('userRol')] || 'login.html';
    });
  </script>
</body>
</html>
