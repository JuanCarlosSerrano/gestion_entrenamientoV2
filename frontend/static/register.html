<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="container">
    <h1>Registro</h1>
    <form id="registrationForm">
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>

      <div class="form-group">
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
      </div>

      <div class="form-group">
        <label for="rol">Rol:</label>
        <select id="rol" name="rol" required>
          <option value="">Selecciona un rol</option>
          <option value="admin">Administrador</option>
          <option value="entrenador">Entrenador</option>
          <option value="atleta">Atleta</option>
        </select>
      </div>
      

      <!-- Campos adicionales SOLO visibles si el rol es atleta -->
      <div id="extra-atleta" style="display: none;">
        <div class="form-group">
          <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono">
        </div>

        <div class="form-group">
          <label for="entrenador_id">ID del Entrenador:</label>
          <input type="number" id="entrenador_id" name="entrenador_id">
        </div>
      </div>
      <div class="form-group">
        <label for="categoria">Categoría:</label>
        <select id="categoria" name="categoria" required>
          <option value="">Selecciona una categoría</option>
          <option value="sub-16">Sub-16</option>
          <option value="sub-18">Sub-18</option>
          <option value="sub-20">Sub-20</option>
          <option value="sub-23">Sub-23</option>
          <option value="absoluto">Absoluto</option>
        </select>
      </div>
      

      <button type="submit">Registrarse</button>
    </form>

    <p>¿Ya tienes una cuenta? <a href="login.html">Iniciar Sesión</a></p>
  </div>

  <script>
    const rolSelect = document.getElementById("rol");
    const extraAtleta = document.getElementById("extra-atleta");

    rolSelect.addEventListener("change", () => {
      if (rolSelect.value === "atleta") {
        extraAtleta.style.display = "block";
      } else {
        extraAtleta.style.display = "none";
      }
    });
  </script>

  <script src="js/script.js"></script>
</body>
</html>
