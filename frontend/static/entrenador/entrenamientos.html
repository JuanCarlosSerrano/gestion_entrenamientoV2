<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrenamientos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/script.js"></script>
  <script src="../js/entrenador/main.js" type="module"></script>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="container mt-4">
    <h1 class="mb-4">Entrenamientos</h1>
    <a href="index.html" class="btn btn-secondary mb-3">Volver al Panel de Entrenador</a>

    <!-- Lista de entrenamientos renderizada en tarjetas -->
    <div id="entrenamientos-list-container">
      <h2 class="mb-3">Entrenamientos Tipo</h2>
      <div id="entrenamientos-grid" class="entrenamiento-grid"></div>
      <!-- Aquí se inyectan dinámicamente las tarjetas -->
    </div>

    <!-- Botón para crear nuevo entrenamiento -->
    <button id="create-entrenamiento-btn" class="btn btn-primary mt-3">Crear Nuevo Entrenamiento</button>

    <!-- Formulario oculto de crear/editar entrenamiento -->
    <div id="entrenamiento-form-container" style="display: none;" class="mt-5">
      <h2>Crear/Editar Entrenamiento</h2>
      <form id="entrenamiento-form-element">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre:</label>
          <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="duracion_valor" class="form-label">Duración Valor:</label>
            <input type="number" class="form-control" id="duracion_valor" name="duracion_valor">
          </div>
          <div class="col-md-6 mb-3">
            <label for="duracion_tipo" class="form-label">Duración Tipo:</label>
            <select class="form-select" id="duracion_tipo" name="duracion_tipo">
              <option value="Minutos">Minutos</option>
              <option value="Kilómetros">Kilómetros</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="calentamiento_tipo" class="form-label">Calentamiento Tipo:</label>
            <select class="form-select" id="calentamiento_tipo" name="calentamiento_tipo">
              <option value="Tiempo">Tiempo</option>
              <option value="Distancia">Distancia</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="calentamiento_valor" class="form-label">Calentamiento Valor:</label>
            <input type="number" class="form-control" id="calentamiento_valor" name="calentamiento_valor">
          </div>
        </div>

        <div class="mb-3">
          <label for="bloque_activacion" class="form-label">Bloque de Activación:</label>
          <textarea class="form-control" id="bloque_activacion" name="bloque_activacion" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label for="bloque_principal" class="form-label">Bloque Principal:</label>
          <textarea class="form-control" id="bloque_principal" name="bloque_principal" rows="3" required></textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="enfriamiento_tipo" class="form-label">Enfriamiento Tipo:</label>
            <select class="form-select" id="enfriamiento_tipo" name="enfriamiento_tipo">
              <option value="Tiempo">Tiempo</option>
              <option value="Distancia">Distancia</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="enfriamiento_valor" class="form-label">Enfriamiento Valor:</label>
            <input type="number" class="form-control" id="enfriamiento_valor" name="enfriamiento_valor">
          </div>
        </div>

        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" id="cancel-entrenamiento-btn" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
