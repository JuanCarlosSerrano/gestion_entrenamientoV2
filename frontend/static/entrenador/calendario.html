<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendario del Atleta</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- FullCalendar CSS -->
  <link rel="stylesheet" href="../libs/fullcalendar/main.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-bg">
  <div class="container app-container">
    <header class="page-heading">
      <div class="page-heading__brand">
        <img src="../img/logo.png" alt="PeakPace" class="brand-logo">
        <div class="page-heading__text">
          <p class="eyebrow">Panel de entrenador</p>
          <h1 id="atleta-name" class="mb-0">Calendario del atleta</h1>
        </div>
      </div>
      <div class="page-heading__actions">
        <a href="/static/entrenador/atletas.html" class="btn btn-outline-brand">
          &larr; Volver a atletas
        </a>
        <button class="btn btn-outline-brand" id="btn-asignar-ciclo">Asignar ciclo</button>
        <button class="btn btn-brand" id="btn-logout">Salir</button>
      </div>
    </header>
    <div id="calendar" class="app-card"></div>

    <!-- Offcanvas: Asignar / editar entrenamiento -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasEntrenamiento" aria-labelledby="offcanvasEntrenamientoLabel">
      <div class="offcanvas-header">
        <h5 id="offcanvasEntrenamientoLabel">Asignar Entrenamiento</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body">
        <form id="form-asignar-entrenamiento">
          <div class="mb-3">
            <label for="select-entrenamiento" class="form-label">Entrenamiento tipo:</label>
            <select class="form-select" id="select-entrenamiento" required></select>
          </div>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>

          <div class="mb-3">
            <label for="duracion_valor" class="form-label">Duración:</label>
            <input type="number" class="form-control" id="duracion_valor">
          </div>

          <div class="mb-3">
            <label for="duracion_tipo" class="form-label">Tipo de duración:</label>
            <input type="text" class="form-control" id="duracion_tipo">
          </div>

          <div class="mb-3">
            <label for="calentamiento_tipo" class="form-label">Calentamiento (tipo):</label>
            <input type="text" class="form-control" id="calentamiento_tipo">
          </div>

          <div class="mb-3">
            <label for="calentamiento_valor" class="form-label">Calentamiento (valor):</label>
            <input type="number" class="form-control" id="calentamiento_valor">
          </div>

          <div class="mb-3">
            <label for="bloque_activacion" class="form-label">Bloque de activación:</label>
            <textarea class="form-control" id="bloque_activacion" rows="2"></textarea>
          </div>

          <div class="mb-3">
            <label for="bloque_principal" class="form-label">Bloque principal:</label>
            <textarea class="form-control" id="bloque_principal" rows="3" required></textarea>
          </div>

          <div class="mb-3">
            <label for="enfriamiento_tipo" class="form-label">Enfriamiento (tipo):</label>
            <input type="text" class="form-control" id="enfriamiento_tipo">
          </div>

          <div class="mb-3">
            <label for="enfriamiento_valor" class="form-label">Enfriamiento (valor):</label>
            <input type="number" class="form-control" id="enfriamiento_valor">
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Asignar Entrenamiento
          </button>

          <button type="button"
                  id="btn-eliminar-entrenamiento"
                  class="btn btn-danger mt-2 w-100"
                  style="display: none;">
            Eliminar Entrenamiento
          </button>
        </form>
      </div>
    </div>
  </div>
  <!-- Modal asignar ciclo -->
  <div class="modal fade" id="modalAsignarCiclo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="form-asignar-ciclo">
        <div class="modal-header">
          <h5 class="modal-title">Asignar ciclo al calendario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Tipo de ciclo</label>
            <select class="form-select" id="select-ciclo-tipo" required>
              <option value="micro" selected>Microciclo (1 semana)</option>
              <option value="meso">Mesociclo (4-7 semanas)</option>
              <option value="macro">Macrociclo (12-14 semanas)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Ciclo disponible</label>
            <select class="form-select" id="select-ciclo-id" required>
              <option value="">Selecciona un ciclo</option>
            </select>
            <small class="text-muted d-block mt-1" id="ayuda-ciclo">Selecciona tipo para ver opciones.</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Modo de anclaje</label>
            <select class="form-select" id="select-ciclo-anclaje">
              <option value="inicio" selected>Anclar en fecha de inicio</option>
              <option value="fin">Anclar en fecha final</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" id="label-ciclo-fecha">Fecha de inicio real</label>
            <input type="date" class="form-control" id="input-ciclo-fecha" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-brand">Asignar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de confirmación (para eliminar) -->
  <div class="modal fade" id="modalConfirmacion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmar acción</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="modal-confirmacion-mensaje">
          ¿Estás seguro de que deseas continuar?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="modal-confirmacion-aceptar">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FullCalendar JS -->
  <script src="../libs/fullcalendar/index.global.min.js"></script>

  <!-- Bootstrap JS (siempre antes de tu script que usa bootstrap.*) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/utils/csrf.js"></script>
  <!-- Tu JS del calendario (el que te pasé completo) -->
  <script src="../js/script.js"></script>
  <script src="../js/entrenador/calendario.js"></script>
</body>
</html>
