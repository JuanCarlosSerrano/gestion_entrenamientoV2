<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Entrenador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/utils/csrf.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/utils/partials.js"></script>
    <script src="../js/entrenador/main.js" type="module"></script>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
</head>
<body class="app-bg">
    <div class="container app-container">
        <div data-include="../partials/header.html" data-nav-active="inicio"></div>

        <div class="page-context-bar page-context-bar--hero">
            <div>
                <p class="eyebrow eyebrow--subtle">Panel de entrenador</p>
                <h1 class="page-context-title">Inicio</h1>
            </div>
        </div>

        <div class="app-card">
            <h2 class="display-4">Bienvenido, Entrenador</h2>
            <p class="lead">Aquí podrás gestionar a tus atletas y sus entrenamientos.</p>
            <hr class="my-4">

            <div class="row">
                <div class="col-md-6">
                  <h3>Próximos Entrenamientos</h3>
                  <div id="proximos-entrenamientos" class="mt-2 text-muted"></div>
                </div>
                <div class="col-md-6">
                  <h3>Atletas con Feedback Pendiente</h3>
                  <div id="feedbacks-pendientes" class="mt-2 text-muted"></div>
                </div>
              </div>              
        </div>
        <div data-include="../partials/footer.html"></div>
    </div>

    <div class="modal fade" id="modalVisibilidadEntreno" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Actualizar visibilidad</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <p id="modal-entreno-info" class="mb-0"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
            <button type="button" class="btn btn-outline-primary" id="btn-modal-ocultar">Ocultar</button>
            <button type="button" class="btn btn-brand" id="btn-modal-mostrar">Mostrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
