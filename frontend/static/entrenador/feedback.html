<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisar feedback · MindPace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/panel_entrenador.css">
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/entrenador/feedback.js" type="module"></script>
</head>
<body class="trainer-control review-page">
  <div class="trainer-shell">
    <aside class="trainer-sidebar" aria-label="Navegación del entrenador">
      <a class="trainer-brand" href="index.html" aria-label="MindPace">
        <img src="../img/logo_sin_fondo.png" alt="" class="trainer-brand__mark">
        <span>MindPace</span>
      </a>
      <nav class="trainer-nav">
        <a class="trainer-nav__link" href="index.html"><span>⌂</span> Inicio</a>
        <a class="trainer-nav__link" href="planificacion_semanal.html"><span>▦</span> Planificar</a>
        <a class="trainer-nav__link" href="atletas.html"><span>👥</span> Atletas</a>
        <a class="trainer-nav__link" href="estadisticas.html"><span>↗</span> Historial</a>
        <a class="trainer-nav__link is-active" href="alertas.html"><span>!</span> Actividad</a>
        <a class="trainer-nav__link" href="utilidades.html"><span>⚙</span> Configuración</a>
      </nav>
      <div class="trainer-sidebar__footer">
        <div class="trainer-sidebar-user">
          <span id="sidebar-trainer-initials">E</span>
          <div>
            <strong id="sidebar-trainer-name">Entrenador</strong>
            <small>Entrenador</small>
          </div>
        </div>
        <button class="trainer-logout" id="btn-logout" type="button">Salir</button>
        <div class="trainer-version">
          <img src="../img/logo_sin_fondo.png" alt="" class="trainer-version__icon">
          <div>
            <strong>MindPace V2</strong>
            <span>Revisión de feedback</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="trainer-main panel-page-main">
      <header class="trainer-topbar">
        <div>
          <h1>Revisar</h1>
          <p>Feedback recibido de tus atletas y respuestas pendientes.</p>
        </div>
      </header>

      <section class="panel-card">
        <div class="panel-tabs" id="feedbackTabs" role="tablist">
          <button class="panel-tab is-active nav-link active" id="no-leidos-tab" data-bs-toggle="tab" data-bs-target="#no-leidos" type="button" role="tab">No leídos</button>
          <button class="panel-tab nav-link" id="leidos-tab" data-bs-toggle="tab" data-bs-target="#leidos" type="button" role="tab">Leídos</button>
        </div>
        <div class="tab-content panel-tab-content" id="feedbackTabsContent">
          <div class="tab-pane fade show active" id="no-leidos" role="tabpanel">
            <ul class="list-group panel-list" id="lista-no-leidos"></ul>
          </div>
          <div class="tab-pane fade" id="leidos" role="tabpanel">
            <ul class="list-group panel-list" id="lista-leidos"></ul>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal fade panel-modal" id="modalFeedback" tabindex="-1" aria-labelledby="modalFeedbackLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalFeedbackLabel">Detalle del feedback</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="modal-feedback-body"></div>
        <div class="modal-footer">
          <button type="button" id="btn-marcar-leido" class="btn btn-brand">Marcar como leído</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
