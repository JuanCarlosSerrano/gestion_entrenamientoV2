<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil del Atleta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <div class="d-flex align-items-center mb-4">
      <img id="foto-atleta" src="../img/default-avatar.jpg" alt="Foto de perfil" class="rounded-circle me-3" width="80" height="80"/>
      <h1 id="nombre-atleta">Nombre del Atleta</h1>
    </div>
 
    <div class="row">
      <!-- Datos del atleta -->
      <div class="col-md-6">
        <h4>Datos personales</h4>
        <ul class="list-group">
          <li class="list-group-item"><strong>Nombre:</strong> <span id="dato-nombre"></span></li>
          <li class="list-group-item"><strong>Apellidos:</strong> <span id="dato-apellidos"></span></li>
          <li class="list-group-item"><strong>Email:</strong> <span id="dato-email"></span></li>
          <li class="list-group-item"><strong>Teléfono:</strong> <span id="dato-telefono"></span></li>
          <li class="list-group-item"><strong>Fecha de nacimiento:</strong> <span id="dato-fecha_nacimiento"></span></li>
          <li class="list-group-item"><strong>Categoría:</strong> <span id="dato-categoria"></span></li>
          <li class="list-group-item"><strong>Grupo:</strong> <span id="dato-grupo"></span></li>
          <li class="list-group-item"><strong>Subgrupo:</strong> <span id="dato-subgrupo"></span></li>
        </ul>
      </div>

      <!-- Calculadora de zonas VAM -->
      <!-- Calculadora de zonas VAM -->
<div class="col-md-6">
  <h4>Calculadora de Zonas (VAM)</h4>
  <form id="form-zonas" class="row g-2 align-items-center mb-3">
    <div class="col-4">
      <label for="minutos" class="form-label">Min:</label>
      <input type="number" id="minutos" class="form-control form-control-sm" min="0" required>
    </div>
    <div class="col-4">
      <label for="segundos" class="form-label">Seg:</label>
      <input type="number" id="segundos" class="form-control form-control-sm" min="0" max="59" required>
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-sm btn-primary mt-4">Calcular Zonas</button>
    </div>
  </form>

  <div id="zonas-result" class="mt-4 d-none">
    <h5>Resultados:</h5>
    <table class="table table-bordered">
      <thead>
        <tr><th>Zona</th><th>Ritmo (min/km)</th></tr>
      </thead>
      <tbody id="tabla-zonas"></tbody>
    </table>
    <button id="guardar-zonas" class="btn btn-success">Guardar zonas en base de datos</button>
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/entrenador/perfil_atleta.js"></script>
</body>
</html>
