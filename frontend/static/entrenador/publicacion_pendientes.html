<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendientes de publicar · MindPace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/planificacion_semanal.css">
  <link rel="stylesheet" href="../css/publicacion_pendientes.css">
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script type="module" src="../js/entrenador/publicacion_pendientes.js"></script>
</head>
<body class="trainer-control publication-page">
  <div class="trainer-shell">
    <aside class="trainer-sidebar" aria-label="Navegación del entrenador">
      <a class="trainer-brand" href="index.html" aria-label="MindPace">
        <img src="../img/logo_sin_fondo.png" alt="" class="trainer-brand__mark">
        <span>MindPace</span>
      </a>
      <nav class="trainer-nav">
        <a class="trainer-nav__link" href="index.html"><span>⌂</span> Inicio</a>
        <a class="trainer-nav__link" href="planificacion_semanal.html"><span>▦</span> Planificar</a>
        <a class="trainer-nav__link" href="atletas.html"><span>👥</span> Atletas</a>
        <a class="trainer-nav__link" href="estadisticas.html"><span>↗</span> Historial</a>
        <a class="trainer-nav__link" href="alertas.html"><span>!</span> Actividad</a>
        <a class="trainer-nav__link" href="utilidades.html"><span>⚙</span> Configuración</a>
      </nav>
      <div class="trainer-sidebar__footer">
        <div class="trainer-sidebar-user">
          <span id="sidebar-trainer-initials">E</span>
          <div>
            <strong id="sidebar-trainer-name">Entrenador</strong>
            <small>Entrenador</small>
          </div>
        </div>
        <button class="trainer-logout" id="btn-logout" type="button">Salir</button>
      </div>
    </aside>

    <main class="trainer-main publication-main">
      <header class="trainer-topbar publication-topbar">
        <div>
          <h1>Entrenamientos pendientes de publicar</h1>
          <p id="publication-summary">Cargando pendientes...</p>
        </div>
        <div class="trainer-topbar__meta">
          <a class="btn btn-outline-secondary" href="index.html">Centro de Control</a>
        </div>
      </header>

      <section class="publication-toolbar" aria-label="Filtros de publicación">
        <div class="publication-tabs" role="tablist">
          <button class="publication-tab is-active" type="button" data-filter="hoy">Hoy</button>
          <button class="publication-tab" type="button" data-filter="manana">Mañana</button>
          <button class="publication-tab" type="button" data-filter="semana">Esta semana</button>
          <button class="publication-tab" type="button" data-filter="todos">Todos</button>
        </div>
        <input class="form-control publication-search" id="publication-search" type="search" placeholder="Buscar atleta o sesión">
      </section>

      <section class="publication-selection" id="publication-selection" hidden>
        <strong id="selected-count">0 seleccionados</strong>
        <div>
          <button class="btn btn-brand" id="bulk-publish" type="button">Publicar ahora</button>
          <button class="btn btn-outline-brand" id="bulk-schedule" type="button">Programar</button>
        </div>
      </section>

      <section class="publication-list" id="publication-list" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="schedule-form">
        <div class="modal-header">
          <h5 class="modal-title">Programar publicación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="schedule-datetime">Fecha y hora</label>
          <input class="form-control" id="schedule-datetime" type="datetime-local" required>
          <p id="schedule-error" class="text-danger small mt-2 mb-0" hidden></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-brand" id="schedule-submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
