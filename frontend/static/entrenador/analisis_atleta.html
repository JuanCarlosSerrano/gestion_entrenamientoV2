<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análisis del atleta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/utils/partials.js"></script>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
</head>
<body class="app-bg">
  <div class="container app-container">
    <div data-include="../partials/header.html" data-nav-active="estadisticas"></div>

    <div class="page-context-bar page-context-bar--hero">
      <div>
        <p class="eyebrow eyebrow--subtle">Panel de entrenador</p>
        <h1 class="page-context-title">Análisis del atleta</h1>
        <p id="athlete-name" class="text-muted mb-0">Cargando atleta...</p>
      </div>
      <a href="estadisticas.html" class="btn btn-sm btn-outline-secondary">Volver</a>
    </div>

    <section class="app-card">
      <div class="row g-3">
        <div class="col-12">
          <section class="app-card app-card--summary">
            <div class="d-flex justify-content-between flex-wrap gap-3 align-items-center">
              <div>
                <h2 class="h5 mb-1">Resumen de la semana</h2>
                <p class="text-muted small mb-0" id="resumen-semana-rango-entrenador">
                  Semana actual
                </p>
              </div>
              <div class="d-flex flex-wrap gap-4">
                <div class="text-end">
                  <div class="small text-muted">Sesiones esta semana</div>
                  <div class="fw-semibold" id="resumen-semana-sesiones-entrenador">-</div>
                </div>
                <div class="text-end">
                  <div class="small text-muted">Completadas</div>
                  <div class="fw-semibold text-success" id="resumen-semana-completadas-entrenador">-</div>
                </div>
                <div class="text-end">
                  <div class="small text-muted">Pendientes</div>
                  <div class="fw-semibold text-warning" id="resumen-semana-pendientes-entrenador">-</div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </section>

    <section class="app-card mt-3">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
          <h2 class="h5 mb-1">Comparativa objetivo vs real</h2>
          <p class="text-muted small mb-0">Selecciona el tipo de entrenamiento.</p>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <label for="filtro-nombre" class="form-label mb-0 small text-muted">Entrenamiento</label>
          <select id="filtro-nombre" class="form-select form-select-sm" style="min-width: 220px"></select>
        </div>
      </div>
      <div id="comparativa-contenido">
        <p class="text-muted mb-0">Selecciona un entrenamiento para ver los tiempos.</p>
      </div>
    </section>

    <div data-include="../partials/footer.html" class="mt-5"></div>
  </div>

  <template id="entrenamiento-item-template">
    <article class="training-card entrenamiento-card sombra-suave">
      <header class="training-card__header">
        <div class="training-card__header-main">
          <div>
            <h3 class="training-card__title entrenamiento-nombre">Entrenamiento</h3>
            <p class="training-card__objective entrenamiento-objetivo mb-1">Objetivo</p>
          </div>
          <span class="chip chip-warning entrenamiento-fecha">--/--/----</span>
        </div>
      </header>
      <div class="training-card__summary mt-2">
        <div class="training-card-blocks"></div>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/entrenador/analisis_atleta.js" type="module"></script>
</body>
</html>
