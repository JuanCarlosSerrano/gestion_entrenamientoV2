<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Grupos - Asignar Entrenamientos</title>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- DataTables Bootstrap 5 CSS -->
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet"/>
  <script src="../js/utils/partials.js"></script>
</head>
<body class="app-bg">
  <div class="container app-container">
    <div data-include="../partials/header.html" data-nav-active="grupos"></div>
    <div class="page-context-bar page-context-bar--hero">
      <div>
        <p class="eyebrow eyebrow--subtle">Panel de entrenador</p>
        <h1 class="page-context-title">Gestión de grupos</h1>
      </div>
      <div class="page-context-actions gap-2">
      </div>
    </div>
    <!-- Filtros -->
    <form id="form-filtros" class="row g-3 mt-4 mb-4 app-card">
      <div class="col-md-3">
        <input type="text" id="grupo" class="form-control" placeholder="Grupo" />
      </div>
      <div class="col-md-3">
        <input type="text" id="subgrupo" class="form-control" placeholder="Subgrupo" />
      </div>
      <div class="col-md-3">
        <select id="categoria" class="form-select">
          <option value="">Categoría</option>
          <option value="sub-16">Sub-16</option>
          <option value="sub-18">Sub-18</option>
          <option value="sub-20">Sub-20</option>
          <option value="sub-23">Sub-23</option>
          <option value="absoluto">Absoluto</option>
        </select>
      </div>
      <div class="col-md-3 d-grid">
        <button type="submit" class="btn btn-primary">Aplicar Filtro</button>
      </div>
    </form>

    <!-- Tabla de atletas -->
    <div class="table-responsive app-card">
      <table id="tabla-atletas" class="table table-striped table-bordered table-theme">
        <thead>
          <tr>
            <th><input type="checkbox" id="check-todos" /></th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Email</th>
            <th>Grupo</th>
            <th>Subgrupo</th>
            <th>Categoría</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Formulario de asignación individual -->
    <form id="form-asignar-entrenamiento" class="mt-4 app-card">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label for="fecha" class="form-label">Fecha:</label>
          <input type="date" id="fecha" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label for="select-entrenamiento" class="form-label">Entrenamiento tipo:</label>
          <select id="select-entrenamiento" class="form-select" required></select>
        </div>
        <div class="col-md-3 d-grid">
          <button type="submit" class="btn btn-success">Asignar entrenamiento</button>
        </div>
      </div>
    </form>

    <!-- Formulario asignar ciclo -->
    <form id="form-asignar-ciclo" class="mt-4 app-card">
      <div class="row g-3 align-items-end form-grid-equal">
        <div class="col-md-3">
          <label for="select-ciclo-tipo" class="form-label">Tipo de ciclo</label>
          <select id="select-ciclo-tipo" class="form-select" required>
            <option value="micro" selected>Microciclo</option>
            <option value="meso">Mesociclo</option>
            <option value="macro">Macrociclo</option>
          </select>
        </div>
        <div class="col-md-5">
          <label for="select-ciclo-id" class="form-label">Ciclo disponible</label>
          <select id="select-ciclo-id" class="form-select" required>
            <option value="">Selecciona un ciclo</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="fecha-ciclo" class="form-label">Inicio real</label>
          <input type="date" id="fecha-ciclo" class="form-control" required />
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-success">Asignar ciclo</button>
        </div>
      </div>
    </form>

    <!-- Resumen -->
    <div id="resumen-asignacion" class="mt-3"></div>

    <!-- Control grupal de visibilidad -->
    <div class="app-card mt-4">
      <h2 class="h5 mb-3">Visibilidad grupal</h2>
      <form id="form-visibilidad-grupo" class="row g-3 align-items-end form-grid-equal">
        <div class="col-md-4">
          <label for="vis-grupo-fecha" class="form-label">Fecha</label>
          <input type="date" id="vis-grupo-fecha" class="form-control" required />
        </div>
        <div class="col-md-4">
          <label for="vis-grupo-modo" class="form-label">Modo</label>
          <select id="vis-grupo-modo" class="form-select">
            <option value="dia">Solo este día</option>
            <option value="semana">Semana completa</option>
          </select>
        </div>
        <div class="col-md-4 d-flex flex-wrap gap-2">
          <button class="btn btn-success flex-grow-1" id="btn-grupo-mostrar">
            <i class="bi bi-eye"></i> Mostrar
          </button>
          <button class="btn btn-outline-secondary flex-grow-1" id="btn-grupo-ocultar">
            <i class="bi bi-eye-slash"></i> Ocultar
          </button>
        </div>
      </form>
    </div>

    <!-- Botón Volver -->
    <div class="mt-4 d-flex justify-content-end">
      <button id="btn-volver" class="btn btn-outline-brand">Volver al panel</button>
    </div>
    <div data-include="../partials/footer.html"></div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

  <!-- DataTables core + Bootstrap 5 integration -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <!-- Tu script personalizado -->
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/entrenador/grupo_entrenamiento.js"></script>

  <!-- Activar DataTables -->
  <script>
    $(document).ready(function () {
      $('#tabla-atletas').DataTable();
    });
  </script>
</body>
</html>
