<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atletas · MindPace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/planificacion_semanal.css">
  <link rel="stylesheet" href="../css/atletas.css">
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script type="module" src="../js/entrenador/atletas.js"></script>
</head>
<body class="trainer-control weekly-planning-page">
  <div class="trainer-shell">
    <aside class="trainer-sidebar" aria-label="Navegación del entrenador">
      <a class="trainer-brand" href="index.html" aria-label="MindPace">
        <img src="../img/logo_sin_fondo.png" alt="" class="trainer-brand__mark">
        <span>MindPace</span>
      </a>

      <nav class="trainer-nav">
        <a class="trainer-nav__link" href="index.html"><span>⌂</span> Inicio</a>
        <a class="trainer-nav__link" href="planificacion_semanal.html"><span>▦</span> Planificar</a>
        <a class="trainer-nav__link is-active" href="atletas.html"><span>👥</span> Atletas</a>
        <a class="trainer-nav__link" href="estadisticas.html"><span>↗</span> Historial</a>
        <a class="trainer-nav__link" href="alertas.html"><span>!</span> Actividad</a>
        <a class="trainer-nav__link" href="utilidades.html"><span>⚙</span> Configuración</a>
      </nav>

      <div class="trainer-sidebar__footer">
        <div class="trainer-sidebar-user">
          <span id="sidebar-trainer-initials">E</span>
          <div>
            <strong id="sidebar-trainer-name">Entrenador</strong>
            <small>Entrenador</small>
          </div>
        </div>
        <button class="trainer-logout" id="btn-logout" type="button">Salir</button>
        <div class="trainer-version">
          <img src="../img/logo_sin_fondo.png" alt="" class="trainer-version__icon">
          <div>
            <strong>MindPace V2</strong>
            <span>Planificación individual</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="trainer-main weekly-main">
      <header class="trainer-topbar weekly-topbar">
        <div>
          <h1>Atletas</h1>
          <p>Selecciona un atleta para consultar su planificación.</p>
        </div>
        <div class="trainer-topbar__meta">
          <a class="btn btn-outline-secondary" href="index.html">Centro de Control</a>
          <a class="btn btn-brand" href="perfil_atleta.html?modo=nuevo">Alta atleta</a>
        </div>
      </header>

      <section class="planner-step" aria-label="Selección de atleta">
        <div class="athlete-toolbar">
          <input type="search" id="athlete-search" class="form-control" placeholder="Buscar atleta...">
          <select id="filter-group" class="form-select" aria-label="Grupo">
            <option value="">Todos los grupos</option>
          </select>
          <select id="filter-subgroup" class="form-select" aria-label="Subgrupo">
            <option value="">Todos los subgrupos</option>
          </select>
          <select id="filter-category" class="form-select" aria-label="Categoría">
            <option value="">Todas las categorías</option>
          </select>
        </div>
        <div class="athlete-list athlete-list--planning" id="atletas-cards" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
