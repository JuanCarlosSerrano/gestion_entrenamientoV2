<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración · MindPace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
</head>
<body class="trainer-control">
  <div class="trainer-shell">
    <aside class="trainer-sidebar" aria-label="Navegación de administración">
      <a class="trainer-brand" href="index.html" aria-label="MindPace">
        <img src="../img/logo_sin_fondo.png" alt="" class="trainer-brand__mark">
        <span>MindPace</span>
      </a>

      <nav class="trainer-nav">
        <a class="trainer-nav__link is-active" href="index.html"><span>⌂</span> Inicio</a>
        <a class="trainer-nav__link" href="usuarios.html"><span>👥</span> Usuarios</a>
      </nav>

      <div class="trainer-sidebar__footer">
        <div class="trainer-sidebar-user">
          <span id="sidebar-admin-initials">A</span>
          <div>
            <strong id="sidebar-admin-name">Administrador</strong>
            <small>Administrador</small>
          </div>
        </div>
        <button class="trainer-logout" id="btn-logout" type="button">Salir</button>
        <div class="trainer-version">
          <img src="../img/logo_sin_fondo.png" alt="" class="trainer-version__icon">
          <div>
            <strong>MindPace V2</strong>
            <span>Panel de administración</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="trainer-main">
      <header class="trainer-topbar">
        <div>
          <h1>Inicio</h1>
          <p>Administración de la plataforma MindPace.</p>
        </div>
      </header>

      <section class="app-card">
        <h2 class="h4 mb-2">Bienvenido, <span id="admin-welcome-name">administrador</span></h2>
        <p class="text-muted mb-0">Selecciona "Usuarios" en el menú para crear, editar o dar de baja cuentas de entrenador y atleta.</p>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-fbbvQ7Y714vahVy9x969njihX4GnvJ1owtkXhxw729m3qP2rs5uqaeX-jvcwU0AJc" crossorigin="anonymous"></script>
  <script src="../js/admin_shell.js"></script>
</body>
</html>
