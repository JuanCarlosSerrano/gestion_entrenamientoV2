<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio · Atleta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/atleta_panel.css" />
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/utils/partials.js"></script>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
</head>
<body class="athlete-panel">
  <div class="athlete-shell">
    <div data-include="../partials/header_atleta.html" data-nav-active="inicio"></div>
    <main class="athlete-main">
      <header class="athlete-topbar">
        <div>
          <h1 id="nombre-atleta">Inicio</h1>
          <p>Tu entrenamiento, tu semana y lo pendiente.</p>
        </div>
      </header>

      <section class="athlete-card athlete-card--hero today-training">
        <div>
          <p class="athlete-eyebrow">Hoy</p>
          <h2 class="h3 mb-1">Entrenamiento de hoy</h2>
          <p class="athlete-muted mb-0" id="today-date">Cargando...</p>
        </div>
        <div id="today-response-alert"></div>
        <div id="today-training-list" class="today-training__grid"></div>
      </section>

      <section class="athlete-action-grid" aria-label="Acciones principales">
        <a class="athlete-action-card" href="entrenamientos.html">
          <span>▦</span>
          <strong>Mi semana</strong>
          <small class="athlete-muted">Ver planificación visible</small>
        </a>
        <a class="athlete-action-card" href="historial.html">
          <span>↗</span>
          <strong>Historial</strong>
          <small class="athlete-muted">Sesiones y feedback</small>
        </a>
        <a class="athlete-action-card" href="feedbacks.html">
          <span>◉</span>
          <strong>Mi evolución</strong>
          <small class="athlete-muted">Resumen básico</small>
        </a>
      </section>

      <section class="athlete-card">
        <div class="athlete-week-header mb-3">
          <div>
            <p class="athlete-eyebrow">Novedades</p>
            <h2 class="h5 mb-0">Actividad reciente</h2>
          </div>
        </div>
        <div id="athlete-news" class="athlete-history-list"></div>
      </section>
    </main>
  </div>
  <script src="../js/atleta/inicio.js" type="module"></script>
</body>
</html>
