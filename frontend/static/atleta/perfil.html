<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil · Atleta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/atleta_panel.css" />
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/utils/partials.js"></script>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
</head>
<body class="athlete-panel">
  <div class="athlete-shell">
    <div data-include="../partials/header_atleta.html" data-nav-active="perfil"></div>
    <main class="athlete-main">
      <header class="athlete-topbar">
        <div>
          <h1>Perfil</h1>
          <p>Tus datos personales y configuración visible.</p>
        </div>
      </header>
      <section class="athlete-detail-layout">
        <article class="athlete-card">
          <div class="d-flex align-items-center gap-3 mb-3">
            <img id="foto-perfil" src="../img/default-avatar.jpg" alt="Foto de perfil" class="rounded-circle" style="width:82px;height:82px;object-fit:cover;">
            <div>
              <p class="athlete-eyebrow">Datos</p>
              <h2 class="h4 mb-0">Datos personales</h2>
            </div>
          </div>
          <form id="form-perfil" class="row g-3">
            <div class="col-md-6"><label class="form-label">Nombre<input type="text" class="form-control" id="input-nombre" required></label></div>
            <div class="col-md-6"><label class="form-label">Apellidos<input type="text" class="form-control" id="input-apellidos" required></label></div>
            <div class="col-md-6"><label class="form-label">Correo electrónico<input type="email" class="form-control" id="input-email" required></label></div>
            <div class="col-md-6"><label class="form-label">Teléfono<input type="tel" class="form-control" id="input-telefono" placeholder="+34 600 000 000"></label></div>
            <div class="col-md-6"><label class="form-label">Fecha de nacimiento<input type="date" class="form-control" id="input-fecha"></label></div>
            <div class="col-md-6"><label class="form-label">Foto<input type="file" class="form-control" id="input-foto" accept="image/*"></label></div>
            <div class="col-12"><button class="btn btn-brand" type="submit">Guardar cambios</button></div>
          </form>
        </article>
        <aside class="athlete-card">
          <p class="athlete-eyebrow">Entrenador</p>
          <div class="athlete-metric-grid mb-3" style="grid-template-columns:1fr;">
            <div class="athlete-metric-card"><span class="athlete-muted">Grupo</span><strong id="perfil-grupo">-</strong></div>
            <div class="athlete-metric-card"><span class="athlete-muted">Categoría</span><strong id="perfil-categoria">-</strong></div>
            <div class="athlete-metric-card"><span class="athlete-muted">Entrenador</span><strong id="perfil-entrenador">-</strong></div>
          </div>
        </aside>
      </section>
      <section class="athlete-card">
        <p class="athlete-eyebrow">Seguridad</p>
        <h2 class="h5 mb-3">Cambiar contraseña</h2>
        <form id="form-password" class="row g-3">
          <div class="col-md-4"><label class="form-label">Contraseña actual<input type="password" class="form-control" id="input-pass-actual" required></label></div>
          <div class="col-md-4"><label class="form-label">Nueva contraseña<input type="password" class="form-control" id="input-pass-nueva" required></label></div>
          <div class="col-md-4"><label class="form-label">Confirmar nueva<input type="password" class="form-control" id="input-pass-confirm" required></label></div>
          <div class="col-12"><button class="btn btn-outline-brand" type="submit">Actualizar contraseña</button></div>
        </form>
      </section>
      <section class="athlete-card">
        <p class="athlete-eyebrow">Zonas</p>
        <div id="zonas-empty" class="athlete-muted">Todavía no se han registrado zonas.</div>
        <div id="zonas-tabla" class="athlete-metric-grid d-none">
          <div id="zonas-body" class="athlete-metric-grid" style="grid-column:1/-1;"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/atleta/perfil.js" type="module"></script>
</body>
</html>
