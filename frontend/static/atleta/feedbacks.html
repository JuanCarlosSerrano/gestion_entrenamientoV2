<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi evolución · Atleta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/atleta_panel.css" />
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/utils/partials.js"></script>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
</head>
<body class="athlete-panel">
  <div class="athlete-shell">
    <div data-include="../partials/header_atleta.html" data-nav-active="feedbacks"></div>
    <main class="athlete-main">
      <header class="athlete-topbar">
        <div>
          <h1>Mi evolución</h1>
          <p>Una lectura básica de tus últimas semanas.</p>
        </div>
      </header>
      <section class="athlete-card">
        <p class="athlete-eyebrow">Resumen</p>
        <div class="athlete-metric-grid" id="evolution-metrics"></div>
      </section>
      <section class="athlete-card">
        <div class="athlete-week-header mb-3">
          <div>
            <p class="athlete-eyebrow">Zonas</p>
            <h2 class="h5 mb-0">Zonas actuales</h2>
          </div>
        </div>
        <div id="evolution-zones" class="athlete-metric-grid"></div>
      </section>
      <section class="athlete-card">
        <p class="athlete-eyebrow">Feedback reciente</p>
        <div id="evolution-feedback" class="athlete-history-list"></div>
      </section>
    </main>
  </div>
  <script src="../js/atleta/feedbacks.js" type="module"></script>
</body>
</html>
