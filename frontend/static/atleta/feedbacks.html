<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedbacks enviados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/utils/partials.js"></script>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon"/>
</head>
<body class="app-bg">
  <div class="container app-container">
    <div data-include="../partials/header_atleta.html" data-nav-active="feedbacks"></div>

    <div class="page-context-bar page-context-bar--hero">
      <div>
        <p class="eyebrow eyebrow--subtle">Panel del atleta</p>
        <h1 class="page-context-title">Feedbacks</h1>
        <p class="text-muted mb-0">Consulta lo que le has enviado a tu entrenador y sus respuestas.</p>
      </div>
    </div>

    <section class="app-card">
      <div id="lista-feedbacks" class="d-flex flex-column gap-3"></div>
    </section>

    <div data-include="../partials/footer.html"></div>
  </div>

  <template id="feedback-card-template">
    <article class="feedback-card sombra-suave">
      <header class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <strong class="feedback-entrenamiento">Entrenamiento</strong>
          <p class="text-muted mb-0 feedback-fecha">--/--/----</p>
        </div>
        <span class="chip feedback-estado">Estado</span>
      </header>
      <div class="mt-2 feedback-contenido"></div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/atleta/feedbacks.js" type="module"></script>
</body>
</html>
