<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial · Atleta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/atleta_panel.css" />
  <script src="../js/utils/csrf.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/utils/partials.js"></script>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
</head>
<body class="athlete-panel">
  <div class="athlete-shell">
    <div data-include="../partials/header_atleta.html" data-nav-active="historial"></div>
    <main class="athlete-main">
      <header class="athlete-topbar">
        <div>
          <h1>Historial</h1>
          <p>Tus sesiones realizadas y lo pendiente de completar.</p>
        </div>
      </header>
      <section class="athlete-detail-layout">
        <article class="athlete-card">
          <div class="athlete-week-header mb-3">
            <div>
              <p class="athlete-eyebrow">Sesiones</p>
              <h2 class="h4 mb-0">Mis entrenamientos</h2>
            </div>
          </div>
          <div id="historial-lista" class="athlete-history-list"></div>
        </article>
        <aside class="athlete-card">
          <p class="athlete-eyebrow" id="history-detail-date">Detalle</p>
          <h2 class="h4" id="history-detail-title">Selecciona una sesión</h2>
          <div id="history-detail-body" class="athlete-muted">Aquí verás el entrenamiento recibido, tu feedback y métricas básicas si existen.</div>
        </aside>
      </section>
    </main>
  </div>
  <script src="../js/atleta/historial.js" type="module"></script>
</body>
</html>
